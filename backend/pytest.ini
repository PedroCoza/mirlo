[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

markers =
    unit: pruebas unitarias aisladas
    integration: pruebas de integracion
    perfiles: gestion de perfiles
    youtube: integracion YouTube
    biblioteca: biblioteca de contenidos
    flujo: flujo completo de la aplicacion
    transcripcion: transcripcion y edicion
    traduccion: traduccion de segmentos

addopts = -v --tb=short --strict-markers -ra
